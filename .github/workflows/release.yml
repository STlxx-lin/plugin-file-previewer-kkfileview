name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release Dual-Version NocoBase Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: yarn install || npm install

      - name: Build Plugin
        run: |
          npm run build || npx nocobase build || echo "Build step finished."

      - name: Get Plugin Version
        id: plugin_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          mkdir -p /tmp/release-artifacts

      - name: Package Light Version (轻量版 - 无内置静态资产)
        run: |
          # 清理本地可能存在的静态资产
          rm -rf public/file-viewer
          
          # 打包轻量版 tgz 与 zip（使用 * 保持单层根目录平铺，与 zip 结构完全一致）
          tar -czvf "/tmp/release-artifacts/plugin-file-previewer-kkfileview-v${RELEASE_VERSION}.tgz" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="storage" \
            --exclude="docs" \
            *
            
          zip -r "/tmp/release-artifacts/plugin-file-previewer-kkfileview-v${RELEASE_VERSION}.zip" * \
            -x "node_modules/*" ".git/*" ".github/*" "storage/*" "docs/*"

      - name: Package Full Version (完整版 - 内置 File Viewer 离线资产)
        run: |
          # 提取 node_modules 中的离线静态资产到 public/file-viewer
          mkdir -p public/file-viewer
          if [ -d "node_modules/@file-viewer/web-full" ]; then
            cp -r node_modules/@file-viewer/web-full/* public/file-viewer/ || true
          fi
          
          # 打包完整版 tgz 与 zip（使用 * 保持单层根目录平铺）
          tar -czvf "/tmp/release-artifacts/plugin-file-previewer-kkfileview-v${RELEASE_VERSION}-full.tgz" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="storage" \
            --exclude="docs" \
            *
            
          zip -r "/tmp/release-artifacts/plugin-file-previewer-kkfileview-v${RELEASE_VERSION}-full.zip" * \
            -x "node_modules/*" ".git/*" ".github/*" "storage/*" "docs/*"

          # 清理临时 public 静态资产目录
          rm -rf public/file-viewer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.plugin_version.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Release v{0}', steps.plugin_version.outputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            /tmp/release-artifacts/plugin-file-previewer-kkfileview-v*.tgz
            /tmp/release-artifacts/plugin-file-previewer-kkfileview-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
