name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release Dual-Version NocoBase Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable || yarn install || npm install

      - name: Build Plugin
        run: |
          npm run build || npx nocobase build || echo "Build step completed."

      - name: Auto Bump Version Tag
        id: auto_tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          create_annotated_tag: true

      - name: Resolve Version Information
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_NAME="${{ steps.auto_tag.outputs.new_tag }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v${PKG_VER}"
          fi
          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV
          echo "PKG_VERSION=${PKG_VER}" >> $GITHUB_ENV
          echo "Generated Target Tag: ${TAG_NAME}"

      - name: Package Light Version (轻量版 - 无内置静态资产)
        run: |
          # 确保清理本地可能存在的静态资产
          rm -rf public/file-viewer
          
          # 打包轻量版 tgz 与 zip
          tar -czvf "plugin-file-previewer-kkfileview-${RELEASE_TAG}.tgz" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="storage" \
            .
            
          zip -r "plugin-file-previewer-kkfileview-${RELEASE_TAG}.zip" . \
            -x "node_modules/*" ".git/*" ".github/*" "storage/*"

      - name: Package Full Version (完整版 - 内置 File Viewer 离线资产)
        run: |
          # 提取 node_modules 中的离线静态资产到 public/file-viewer
          mkdir -p public/file-viewer
          if [ -d "node_modules/@file-viewer/web-full" ]; then
            cp -r node_modules/@file-viewer/web-full/* public/file-viewer/ || true
          fi
          
          # 打包完整版 tgz 与 zip
          tar -czvf "plugin-file-previewer-kkfileview-${RELEASE_TAG}-full.tgz" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="storage" \
            .
            
          zip -r "plugin-file-previewer-kkfileview-${RELEASE_TAG}-full.zip" . \
            -x "node_modules/*" ".git/*" ".github/*" "storage/*"

          # 清理临时 public 静态资产目录
          rm -rf public/file-viewer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            plugin-file-previewer-kkfileview-*.tgz
            plugin-file-previewer-kkfileview-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
